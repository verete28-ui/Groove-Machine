<!doctype html>
<html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groove Lab 0.9</title>
<style>
:root{font-family:system-ui;background:#101821;color:#eef5fa}*{box-sizing:border-box}body{margin:0;padding:12px}main{max-width:850px;margin:auto}
header,.line,.transport{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}h1{font-size:22px}
button{background:#263a48;color:inherit;border:1px solid #507084;border-radius:9px;padding:10px;cursor:pointer;font:inherit}
button.active{background:#087d9a} .panel{border:1px solid #455a67;background:#182630;border-radius:12px;padding:12px;margin:12px 0}
.hide{display:none!important}.tabs{display:flex;gap:8px}.tabs button{flex:1}.grid{direction:ltr}
.track{display:grid;grid-template-columns:36px repeat(16,minmax(0,1fr));gap:3px;align-items:center;margin:14px 0}
.step{min-width:0;aspect-ratio:1;padding:0;border-radius:4px;background:#2a3b48}.step.hit{background:#22a6c9}.step.current{outline:2px solid white}
.beats{display:grid;grid-template-columns:36px repeat(16,minmax(0,1fr));gap:3px;direction:ltr;text-align:center;font-size:11px;color:#b0c4d0}
#score{direction:ltr;overflow:hidden;background:#fff;color:#17212a;border-radius:8px;min-height:0;width:100%}#score svg{display:block;width:100%;height:auto;max-width:100%}
.variations{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}.variations button{min-width:0;padding:10px 3px}.variations button.pending{border-color:#efc14b;box-shadow:inset 0 0 0 1px #efc14b}.variations button.active{background:#087d9a}.small{font-size:12px;color:#afc0cc}input[type=range]{accent-color:#24abd0;max-width:180px}
</style>
<main>
<header><div><h1>🥁 Groove Lab <small style="font-size:12px">0.9</small></h1><div class="small">מכונת תופים לימודית · 4/4 · תיבה אחת</div></div><button id="toggle">⚙ הגדרות ▾</button></header>
<section id="settings" class="panel line"><label>BPM <input type="range" id="bpm" min="40" max="180" value="80"> <b id="bpmOut">80</b></label><label><input id="loop" type="checkbox" checked> לופ</label><label><input id="metro" type="checkbox"> קליק</label><button id="reset">איפוס</button></section>
<div class="panel" style="padding:10px"><div class="small">וריאציות — מעבר בתחילת התיבה הבאה</div><div class="variations" id="variations" dir="ltr"></div><div class="line"><span class="small" id="variationStatus">וריאציה A פעילה</span><div><button id="copyVar" title="העתקת התבנית הנוכחית לוריאציה אחרת">העתק אל…</button></div></div></div>
<div class="tabs"><button class="active" data-view="seq">סיקוונסר</button><button data-view="score">תווים</button></div>
<section class="panel"><div id="seq" class="grid"></div><div id="scoreWrap" class="hide"><div id="score"></div><p id="scoreMsg" class="small">תיווי לתרגול · קריאה בלבד</p></div>
<div class="transport"><div><button id="play" class="active">▶ נגן</button> <button id="stop">■ עצור</button></div><span id="status" class="small">מוכן</span></div></section>
<p class="small">לחיצה על משבצת עורכת את המקצב. שתי התצוגות חולקות את אותם נתונים. ארבע וריאציות עצמאיות. השינויים נשמרים בדפדפן; התיווי עדיין בגרסת בדיקה.</p>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const base=()=>[Array.from({length:16},(_,i)=>i%2===0),Array.from({length:16},(_,i)=>i===4||i===12),Array.from({length:16},(_,i)=>i===0||i===8)];
const clone=p=>p.map(row=>row.slice());
const defaults=[base(),
 [Array.from({length:16},(_,i)=>i%2===0),Array.from({length:16},(_,i)=>i===4||i===12),Array.from({length:16},(_,i)=>[0,7,10].includes(i))],
 [Array.from({length:16},(_,i)=>true),Array.from({length:16},(_,i)=>i===4||i===12),Array.from({length:16},(_,i)=>i===0||i===8)],
 [Array.from({length:16},(_,i)=>i%2===0),Array.from({length:16},(_,i)=>[4,12,14,15].includes(i)),Array.from({length:16},(_,i)=>i===0||i===8)]];
const storageKey='groove-lab-variations-v1';
let variations=defaults.map(clone);
try{const saved=JSON.parse(localStorage.getItem(storageKey));if(Array.isArray(saved)&&saved.length===4&&saved.every(v=>Array.isArray(v)&&v.length===3&&v.every(row=>Array.isArray(row)&&row.length===16)))variations=saved.map(v=>v.map(row=>row.map(Boolean)))}catch(e){}
let currentVariation=0,pendingVariation=null,patterns=variations[currentVariation];
function saveVariations(){try{localStorage.setItem(storageKey,JSON.stringify(variations))}catch(e){}}
function paintVariations(){const host=$('variations');host.replaceChildren();'ABCD'.split('').forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.className=(i===currentVariation?'active ':'')+(i===pendingVariation?'pending':'');b.setAttribute('aria-label','וריאציה '+name);b.onclick=()=>selectVariation(i);host.appendChild(b)});$('variationStatus').textContent=pendingVariation!==null?'מעבר ל־'+ 'ABCD'[pendingVariation]+' בתחילת התיבה הבאה':'וריאציה '+ 'ABCD'[currentVariation]+' פעילה'}
function activateVariation(i){currentVariation=i;pendingVariation=null;patterns=variations[i];paintVariations();seq();score()}
function selectVariation(i){if(running){pendingVariation=i===currentVariation?null:i;paintVariations()}else activateVariation(i)}

const names=['HH','SN','KD'];let ctx,bus,running=false,timer=null,position=0,next=0,rev=0,shownStep=-1,scorePositions=[],scoreCursor=null;
function seq(){const host=$('seq');host.replaceChildren();patterns.forEach((a,r)=>{const row=document.createElement('div');row.className='track';const label=document.createElement('span');label.textContent=names[r];row.append(label);a.forEach((hit,i)=>{const b=document.createElement('button');b.className='step'+(hit?' hit':'');b.setAttribute('aria-label',names[r]+' step '+(i+1));b.onclick=()=>{a[i]=!a[i];saveVariations();seq();score()};row.append(b)});host.append(row)});
const ticks=document.createElement('div');ticks.className='beats';ticks.innerHTML='<span></span>'+Array.from({length:16},(_,i)=>'<span>'+(i%4===0?(i/4+1):'')+'</span>').join('');host.append(ticks)}
function score(){
 const host=$('score');host.replaceChildren();
 const VF=window.Vex?.Flow;
 if(!VF){$('scoreMsg').textContent='ספריית התווים אינה זמינה. בדוק חיבור לאינטרנט.';return}
 try{
  const renderer=new VF.Renderer(host,VF.Renderer.Backends.SVG);
  const width=620;
  renderer.resize(width,160);
  const c=renderer.getContext(),stave=new VF.Stave(40,18,550);
  stave.addClef('percussion').addTimeSignature('4/4');
  stave.setContext(c).draw();
  // A single complete rhythmic voice: every attack in the sequencer is represented.
  // Rests describe silence of the entire kit, never silence of an individual drum.
  const notes=[],beamGroups=[],stepsOfNotes=[];
  const durations={1:'16',2:'8',4:'q'};
  const anyHit=i=>patterns.some(row=>row[i]);
  for(let beat=0;beat<4;beat++){
   const beatNotes=[];
   const append=(at,length,rest)=>{
    const keys=[];
    if(!rest){
     if(patterns[2][at])keys.push('f/4');
     if(patterns[1][at])keys.push('c/5');
     if(patterns[0][at])keys.push('g/5/x');
    }
    const n=new VF.StaveNote({
     clef:'percussion',keys:rest?['b/4']:keys,
     duration:durations[length]+(rest?'r':''),
     stem_direction:1
    });
    notes.push(n);stepsOfNotes.push(at);beatNotes.push({note:n,rest,length});
   };
   const start=beat*4;
   // Align to both eighth-note subdivisions in EVERY beat, including beat four.
   // A missing offbeat becomes an eighth rest instead of extending the previous note.
   if(![0,1,2,3].some(i=>anyHit(start+i))){
    append(start,4,true);
   }else{
    for(let half=0;half<2;half++){
     const s=start+half*2,first=anyHit(s),second=anyHit(s+1);
     if(second){
      append(s,1,!first);
      append(s+1,1,false);
     }else{
      append(s,2,!first);
     }
    }
   }
   let group=[];
   const flush=()=>{if(group.length>=2)beamGroups.push(group);group=[]};
   for(const item of beatNotes){
    if(item.rest||item.length>=4)flush();
    else group.push(item.note);
   }
   flush();
  }
  const voice=new VF.Voice({num_beats:4,beat_value:4});
  voice.addTickables(notes);
  new VF.Formatter().joinVoices([voice]).format([voice],455);
  // IMPORTANT: attach beams BEFORE drawing notes, or VexFlow draws redundant flags.
  const beams=beamGroups.map(group=>new VF.Beam(group));
  voice.draw(c,stave);
  beams.forEach(beam=>beam.setContext(c).draw());
  const svg=host.querySelector('svg');
  if(svg){
   svg.setAttribute('viewBox','0 0 '+width+' 160');
   svg.setAttribute('width','100%');
   svg.setAttribute('height','auto');
   svg.style.width='100%';svg.style.height='auto';svg.style.display='block';
   const pairs=notes.map((note,i)=>({step:stepsOfNotes[i],x:note.getAbsoluteX()}));
   scorePositions=Array.from({length:16},(_,step)=>{
    const left=[...pairs].reverse().find(p=>p.step<=step)||pairs[0];
    const right=pairs.find(p=>p.step>step)||{step:16,x:585};
    const t=(step-left.step)/(right.step-left.step);
    return left.x+(right.x-left.x)*t;
   });
   scoreCursor=document.createElementNS('http://www.w3.org/2000/svg','line');
   scoreCursor.setAttribute('y1','13');scoreCursor.setAttribute('y2','118');
   scoreCursor.setAttribute('stroke','#e65142');scoreCursor.setAttribute('stroke-width','2.5');
   scoreCursor.setAttribute('opacity','0');scoreCursor.setAttribute('pointer-events','none');
   svg.appendChild(scoreCursor);
   markScore(shownStep);
  }
  $('scoreMsg').textContent='תיווי בסנכרון עם הנגן · הפסקות מדויקות גם בפעמה 4';
 }catch(e){$('scoreMsg').textContent='שגיאה בתיווי: '+e.message}
}
function init(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ctx=new C();bus=ctx.createGain();bus.gain.value=.45;bus.connect(ctx.destination)}ctx.resume();return true}
function tone(t,hz,d,v,end){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(hz,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+d*.8);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(bus);o.start(t);o.stop(t+d)}
function noise(t,d,hz,v){const buf=ctx.createBuffer(1,Math.ceil(d*ctx.sampleRate),ctx.sampleRate),a=buf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=buf;f.type='highpass';f.frequency.value=hz;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+d)}
function sound(i,t){if(patterns[0][i])noise(t,.045,6400,.24);if(patterns[1][i]){noise(t,.13,1100,.48);tone(t,170,.07,.15)}if(patterns[2][i])tone(t,145,.24,.85,43);if($('metro').checked&&i%4===0)tone(t,i===0?1100:880,.025,.1)}
function markScore(s){if(!scoreCursor)return;if(s<0||!Number.isFinite(scorePositions[s])){scoreCursor.setAttribute('opacity','0');return}const x=scorePositions[s];scoreCursor.setAttribute('x1',x);scoreCursor.setAttribute('x2',x);scoreCursor.setAttribute('opacity','0.85')}
function mark(s){shownStep=s;$('seq').querySelectorAll('.track').forEach(row=>row.querySelectorAll('.step').forEach((b,i)=>b.classList.toggle('current',i===s)));markScore(s)}
function stop(){running=false;pendingVariation=null;paintVariations();rev++;clearInterval(timer);timer=null;position=0;mark(-1);$('play').textContent='▶ נגן';$('status').textContent='מוכן';if(ctx){bus.gain.setTargetAtTime(0,ctx.currentTime,.008);bus=ctx.createGain();bus.gain.value=.45;bus.connect(ctx.destination)}}
function tick(){if(!running)return;const n=rev;while(next<ctx.currentTime+.09&&running){const i=position,t=next;
  if(i===0&&pendingVariation!==null)activateVariation(pendingVariation);
  sound(i,t);setTimeout(()=>{if(running&&rev===n){mark(i);$('status').textContent='פעמה '+(Math.floor(i/4)+1)}},Math.max(0,(t-ctx.currentTime)*1000));next+=60/Number($('bpm').value)/4;position++;if(position===16){position=0;if(!$('loop').checked){clearInterval(timer);timer=null;setTimeout(()=>{if(rev===n)stop()},Math.max(0,(next-ctx.currentTime)*1000));break}}}}
$('play').onclick=()=>{if(running){stop();return}if(!init())return;running=true;rev++;position=0;next=ctx.currentTime+.05;$('play').textContent='Ⅱ השהה';tick();timer=setInterval(tick,20)};
$('stop').onclick=stop;
$('bpm').oninput=()=>{$('bpmOut').textContent=$('bpm').value};
$('toggle').onclick=()=>{$('settings').classList.toggle('hide');$('toggle').textContent=$('settings').classList.contains('hide')?'⚙ הגדרות ▸':'⚙ הגדרות ▾'};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));$('seq').classList.toggle('hide',b.dataset.view!=='seq');$('scoreWrap').classList.toggle('hide',b.dataset.view!=='score');if(b.dataset.view==='score')score()});
$('reset').onclick=()=>{variations[currentVariation]=clone(defaults[currentVariation]);patterns=variations[currentVariation];saveVariations();seq();score()};
$('copyVar').onclick=()=>{
 const name=prompt('לאיזו וריאציה להעתיק? A, B, C או D');
 if(!name)return;const dest='ABCD'.indexOf(name.trim().toUpperCase());
 if(dest<0){alert('בחר A, B, C או D');return}
 if(dest===currentVariation)return;
 variations[dest]=clone(patterns);saveVariations();
 $('variationStatus').textContent='הועתק אל וריאציה '+ 'ABCD'[dest];
};
paintVariations();seq();window.addEventListener('load',score);
})();
</script></main></html>
